<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal Popup with Bracey</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    height: 100%;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #17142B;
    font-family: "Segoe UI", sans-serif;
  }

  /* ---------- 9:16 stage (everything scales with its width) ---------- */
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 16));
    height: min(100vh, calc(100vw * 16 / 9));
    container-type: size;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #F3F0FF 0%, #E8E3FF 55%, #D9D2FA 100%);
  }

  /* ---------- app card ---------- */
  .app {
    position: absolute;
    top: 8cqw;
    left: 8cqw;
    right: 8cqw;
    padding: 8cqw 6cqw;
    border-radius: 7cqw;
    background: #fff;
    box-shadow: 0 2cqw 6cqw rgba(60, 40, 120, 0.12);
    text-align: center;
  }

  .tag {
    font-size: 3.6cqw;
    font-weight: 700;
    letter-spacing: 0.5cqw;
    text-transform: uppercase;
    color: #2BB88A;
  }

  .app h1 {
    margin: 1cqw 0;
    font-size: 9cqw;
    color: #222;
  }

  .sub {
    font-size: 4.2cqw;
    color: #777;
  }

  .open-btn {
    margin-top: 6cqw;
    padding: 4cqw 10cqw;
    border: none;
    border-radius: 99cqw;
    background: #2BB88A;
    color: #fff;
    font-size: 5cqw;
    font-weight: 700;
    box-shadow: 0 1.5cqw 4cqw rgba(43, 184, 138, 0.4);
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .open-btn:hover {
    transform: translateY(-0.6cqw);
  }

  .open-btn:active,
  .open-btn.pressed {
    transform: scale(0.94);
  }

  /* ---------- overlay + modal ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 26cqw;
    background: rgba(30, 20, 60, 0);
    -webkit-backdrop-filter: blur(0);
    backdrop-filter: blur(0);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease,
                background 0.3s ease,
                backdrop-filter 0.3s ease,
                -webkit-backdrop-filter 0.3s ease,
                visibility 0s linear 0.3s;
  }

  .overlay.open {
    background: rgba(30, 20, 60, 0.38);
    -webkit-backdrop-filter: blur(2.4cqw);
    backdrop-filter: blur(2.4cqw);
    opacity: 1;
    visibility: visible;
    transition-delay: 0s;
  }

  .modal {
    position: relative;
    width: 78cqw;
    padding: 7cqw 6cqw 6cqw;
    border-radius: 7cqw;
    background: #fff;
    box-shadow: 0 4cqw 10cqw rgba(0, 0, 0, 0.25);
    text-align: center;
    transform: scale(0.7) translateY(6cqw);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
  }

  .overlay.open .modal {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .close {
    position: absolute;
    top: 3cqw;
    right: 3.5cqw;
    width: 8cqw;
    height: 8cqw;
    border: none;
    border-radius: 50%;
    background: #F1EEFF;
    color: #666;
    font-size: 5.5cqw;
    line-height: 8cqw;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }

  .close:hover {
    background: #E2DCFF;
    transform: rotate(90deg);
  }

  .check {
    width: 14cqw;
    height: 14cqw;
    margin: 0 auto 3cqw;
    border-radius: 50%;
    background: #7CE0B8;
    color: #fff;
    font-size: 8cqw;
    font-weight: 700;
    line-height: 14cqw;
  }

  .modal h2 {
    margin-bottom: 2cqw;
    font-size: 7cqw;
    color: #222;
  }

  .modal p {
    margin-bottom: 5cqw;
    font-size: 4cqw;
    line-height: 1.5;
    color: #666;
  }

  .ok-btn {
    width: 100%;
    padding: 3.6cqw 0;
    border: none;
    border-radius: 99cqw;
    background: #2BB88A;
    color: #fff;
    font-size: 4.8cqw;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .ok-btn:hover {
    transform: translateY(-0.5cqw);
  }

  .ok-btn:active,
  .ok-btn.pressed {
    transform: scale(0.95);
  }

  /* ---------- Bracey ---------- */
  .bracey {
    position: absolute;
    left: 50%;
    bottom: 6cqw;
    width: 60cqw;
    height: auto;
    margin-left: -30cqw;
    z-index: 12;
    overflow: visible;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .body-group {
    transform-origin: 150px 292px;
    animation: bob 2.4s ease-in-out infinite;
  }

  .shadow {
    transform-origin: 150px 297px;
    animation: shadow 2.4s ease-in-out infinite;
  }

  .arm-left {
    transform-origin: 68px 112px;
    animation: sway 3s ease-in-out infinite;
  }

  .arm-right {
    transform-origin: 232px 112px;
    animation: sway 3s ease-in-out infinite reverse;
  }

  .antenna-dot {
    transform-origin: 150px 42px;
    animation: pulse 1.6s ease-in-out infinite;
  }

  .badge-text {
    animation: glow 2.4s ease-in-out infinite;
  }

  .eye {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.12s ease;
  }

  .eyes-happy,
  .m-grin,
  .m-o {
    display: none;
  }

  .bracey.is-happy .eyes,
  .bracey.is-happy .m-smile {
    display: none;
  }

  .bracey.is-happy .eyes-happy,
  .bracey.is-happy .m-grin {
    display: inline;
  }

  .bracey.is-surprised .m-smile {
    display: none;
  }

  .bracey.is-surprised .m-o {
    display: inline;
  }

  .bracey.is-surprised .eye {
    transform: scale(1.25);
  }

  .bracey.is-blink .eye {
    transform: scaleY(0.1);
  }

  .bracey.is-happy .body-group {
    animation: jump 0.7s ease-in-out 2;
  }

  .bracey.is-wave .arm-right {
    animation: wave 0.6s ease-in-out 3;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  @keyframes shadow {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(0.9); opacity: 0.75; }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(3deg); }
    50%      { transform: rotate(-3deg); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.3); opacity: 0.7; }
  }

  @keyframes glow {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }

  @keyframes jump {
    0%   { transform: translateY(0) scale(1, 1); }
    15%  { transform: translateY(0) scale(1.06, 0.92); }
    50%  { transform: translateY(-30px) scale(0.97, 1.04); }
    85%  { transform: translateY(0) scale(1.05, 0.94); }
    100% { transform: translateY(0) scale(1, 1); }
  }

  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-32deg); }
  }
</style>
</head>
<body>

<div class="stage">

  <main class="app">
    <p class="tag">Episode 13</p>
    <h1>Modal Popup</h1>
    <p class="sub">HTML, CSS and JavaScript</p>
    <button class="open-btn" id="openBtn">Open Modal</button>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close" id="closeBtn" aria-label="Close">&times;</button>
      <div class="check">&#10003;</div>
      <h2 id="modalTitle">Welcome aboard!</h2>
      <p>This popup opens over a blurred background.</p>
      <button class="ok-btn" id="okBtn">Got it</button>
    </div>
  </div>

  <svg id="bracey" class="bracey" viewBox="0 0 300 330" role="img" aria-label="Bracey, a friendly mint green mascot">
    <defs>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#A6F3D3"/>
        <stop offset="1" stop-color="#55C49B"/>
      </linearGradient>
      <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#21443C"/>
        <stop offset="1" stop-color="#0F211D"/>
      </linearGradient>
      <linearGradient id="shoeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset="1" stop-color="#DAD6F0"/>
      </linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <ellipse class="shadow" cx="150" cy="297" rx="74" ry="9" fill="#000" fill-opacity="0.14"/>

    <g class="body-group">

      <line x1="150" y1="70" x2="150" y2="50" stroke="#1F7A5C" stroke-width="5" stroke-linecap="round"/>
      <circle class="antenna-dot" cx="150" cy="42" r="8" fill="#FFE08A" filter="url(#glow)"/>

      <rect x="112" y="238" width="22" height="42" rx="10" fill="#1F7A5C"/>
      <rect x="166" y="238" width="22" height="42" rx="10" fill="#1F7A5C"/>
      <ellipse cx="121" cy="284" rx="25" ry="11" fill="url(#shoeGrad)"/>
      <ellipse cx="179" cy="284" rx="25" ry="11" fill="url(#shoeGrad)"/>
      <path d="M98 288 Q121 296 144 288" fill="none" stroke="#B9B4DD" stroke-width="2" stroke-linecap="round"/>
      <path d="M156 288 Q179 296 202 288" fill="none" stroke="#B9B4DD" stroke-width="2" stroke-linecap="round"/>

      <g class="arm-left">
        <path d="M68 112 Q46 112 46 134 V160 Q46 178 28 178 Q46 178 46 196 V220 Q46 242 68 242"
              fill="none" stroke="#1F7A5C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="arm-right">
        <path d="M232 112 Q254 112 254 134 V160 Q254 178 272 178 Q254 178 254 196 V220 Q254 242 232 242"
              fill="none" stroke="#1F7A5C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <rect x="65" y="70" width="170" height="175" rx="52" fill="url(#bodyGrad)"/>
      <path d="M65 190 Q65 245 117 245 H183 Q235 245 235 190 Q150 222 65 190 Z" fill="#4DB992" fill-opacity="0.55"/>
      <ellipse cx="100" cy="88" rx="22" ry="8" fill="#FFFFFF" fill-opacity="0.5" transform="rotate(-22 100 88)"/>

      <rect x="82" y="88" width="136" height="92" rx="30" fill="url(#screenGrad)"/>
      <path d="M96 100 Q112 94 128 100" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>

      <g class="eyes" filter="url(#glow)">
        <g class="eye">
          <circle cx="122" cy="128" r="13" fill="#CFFFEA"/>
          <g class="pupil">
            <circle cx="122" cy="128" r="6" fill="#12332C"/>
            <circle cx="119.5" cy="125.5" r="2" fill="#FFFFFF"/>
          </g>
        </g>
        <g class="eye">
          <circle cx="178" cy="128" r="13" fill="#CFFFEA"/>
          <g class="pupil">
            <circle cx="178" cy="128" r="6" fill="#12332C"/>
            <circle cx="175.5" cy="125.5" r="2" fill="#FFFFFF"/>
          </g>
        </g>
      </g>

      <g class="eyes-happy" filter="url(#glow)" fill="none" stroke="#CFFFEA" stroke-width="5" stroke-linecap="round">
        <path d="M108 132 Q122 114 136 132"/>
        <path d="M164 132 Q178 114 192 132"/>
      </g>

      <circle cx="98" cy="156" r="7" fill="#FF9EB5" fill-opacity="0.75"/>
      <circle cx="202" cy="156" r="7" fill="#FF9EB5" fill-opacity="0.75"/>

      <path class="m-smile" d="M136 152 Q150 166 164 152" fill="none" stroke="#CFFFEA" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
      <g class="m-grin">
        <path d="M133 150 Q150 180 167 150 Z" fill="#CFFFEA"/>
        <ellipse cx="150" cy="164" rx="8" ry="4" fill="#FF9EB5"/>
      </g>
      <ellipse class="m-o" cx="150" cy="160" rx="6" ry="8" fill="none" stroke="#CFFFEA" stroke-width="4.5" filter="url(#glow)"/>

      <rect x="116" y="196" width="68" height="34" rx="12" fill="#3FA982" fill-opacity="0.45"/>
      <text class="badge-text" x="150" y="220" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#17503D">&lt;/&gt;</text>

    </g>
  </svg>

</div>

<script>
  const bracey = document.getElementById("bracey");
  const pupils = document.querySelectorAll(".pupil");
  const overlay = document.getElementById("overlay");
  const openBtn = document.getElementById("openBtn");
  const closeBtn = document.getElementById("closeBtn");
  const okBtn = document.getElementById("okBtn");
  let moodTimer;

  /* ---------- Bracey moods ---------- */
  function setMood(mood, duration = 1900) {
    bracey.classList.remove("is-happy", "is-surprised", "is-wave");
    bracey.getBoundingClientRect(); // restart the animations

    if (mood === "happy") bracey.classList.add("is-happy", "is-wave");
    if (mood === "surprised") bracey.classList.add("is-surprised");
    if (mood === "wave") bracey.classList.add("is-wave");

    clearTimeout(moodTimer);
    moodTimer = setTimeout(() => {
      bracey.classList.remove("is-happy", "is-surprised", "is-wave");
    }, duration);
  }

  bracey.addEventListener("click", () => setMood("happy"));

  window.addEventListener("pointermove", (e) => {
    const box = bracey.getBoundingClientRect();
    const cx = box.left + box.width / 2;
    const cy = box.top + box.height * 0.4;
    const dx = e.clientX - cx;
    const dy = e.clientY - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const strength = (Math.min(dist, 140) / 140) * 5;
    const x = (dx / dist) * strength;
    const y = (dy / dist) * strength;

    pupils.forEach((pupil) => {
      pupil.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")");
    });
  });

  function blink() {
    bracey.classList.add("is-blink");
    setTimeout(() => bracey.classList.remove("is-blink"), 140);
    setTimeout(blink, 2200 + Math.random() * 3000);
  }
  setTimeout(blink, 2000);

  /* ---------- modal ---------- */
  function openModal() {
    overlay.classList.add("open");
    setMood("surprised", 1500);
  }

  function closeModal(mood) {
    overlay.classList.remove("open");
    setMood(mood, 1900);
  }

  openBtn.addEventListener("click", openModal);
  closeBtn.addEventListener("click", () => closeModal("wave"));
  okBtn.addEventListener("click", () => closeModal("happy"));

  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal("wave");
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeModal("wave");
  });

  /* ---------- hands-free demo for screen recording: add ?auto to the URL ---------- */
  function press(button) {
    button.classList.add("pressed");
    setTimeout(() => button.classList.remove("pressed"), 220);
  }

  function runDemo() {
    setTimeout(() => setMood("wave"), 300);
    setTimeout(() => { press(openBtn); openModal(); }, 1900);
    setTimeout(() => { press(okBtn); closeModal("happy"); }, 5400);
  }

  if (location.search.indexOf("auto") !== -1) {
    runDemo();
    setInterval(runDemo, 9500);
  } else {
    setTimeout(() => setMood("wave"), 600);
  }
</script>

</body>
</html>
