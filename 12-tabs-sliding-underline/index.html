<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabs with Sliding Underline</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #E8E3FF;
    font-family: "Segoe UI", sans-serif;
  }

  .tabs {
    width: 90%;
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }

  .tab-list {
    position: relative;
    display: flex;
    border-bottom: 2px solid #eee;
  }

  .tab {
    flex: 1;
    padding: 16px 10px;
    background: none;
    border: none;
    font-size: 15px;
    font-weight: 600;
    color: #888;
    cursor: pointer;
    transition: color 0.3s ease;
  }

  .tab:hover {
    color: #444;
  }

  .tab.active {
    color: #2BB88A;
  }

  .underline {
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 3px;
    background: #2BB88A;
    border-radius: 3px;
  }

  .underline.ready {
    transition: left 0.35s ease, width 0.35s ease;
  }

  .panel {
    display: none;
    padding: 24px 22px 28px;
    animation: fadeIn 0.4s ease;
  }

  .panel.active {
    display: block;
  }

  .panel h3 {
    margin-bottom: 8px;
    font-size: 18px;
    color: #222;
  }

  .panel p {
    font-size: 15px;
    line-height: 1.6;
    color: #555;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>

<div class="tabs">

  <div class="tab-list">
    <button class="tab active" data-tab="html">HTML</button>
    <button class="tab" data-tab="css">CSS</button>
    <button class="tab" data-tab="js">JavaScript</button>
    <span class="underline"></span>
  </div>

  <div class="panel active" id="html">
    <h3>HTML</h3>
    <p>HTML builds the structure of a web page: headings, buttons, images and everything you see on screen.</p>
  </div>

  <div class="panel" id="css">
    <h3>CSS</h3>
    <p>CSS styles that structure with colors, spacing, layouts and smooth animations.</p>
  </div>

  <div class="panel" id="js">
    <h3>JavaScript</h3>
    <p>JavaScript adds behavior, like switching tabs when you click and moving the underline.</p>
  </div>

</div>

<script>
  const tabs = document.querySelectorAll(".tab");
  const panels = document.querySelectorAll(".panel");
  const underline = document.querySelector(".underline");

  function moveUnderline(tab) {
    underline.style.left = tab.offsetLeft + "px";
    underline.style.width = tab.offsetWidth + "px";
  }

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      tabs.forEach((t) => t.classList.remove("active"));
      panels.forEach((p) => p.classList.remove("active"));

      tab.classList.add("active");
      document.getElementById(tab.dataset.tab).classList.add("active");
      moveUnderline(tab);
    });
  });

  // place the underline under the first tab, then enable the slide animation
  moveUnderline(document.querySelector(".tab.active"));
  requestAnimationFrame(() => underline.classList.add("ready"));

  window.addEventListener("resize", () => {
    moveUnderline(document.querySelector(".tab.active"));
  });
</script>

</body>
</html>
